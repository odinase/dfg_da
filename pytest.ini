[pytest]
# Repo root on sys.path so `import dfg_da.*` and `import cluster_data_asso` resolve.
pythonpath = .
testpaths = dfg_da/tests
# importlib mode avoids pytest deriving a doubled package name (`dfg_da.dfg_da`)
# from the stray root __init__.py + the same-named repo dir / inner package.
addopts = --import-mode=importlib
