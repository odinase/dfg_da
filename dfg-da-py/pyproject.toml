[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "dfg_da_py"
version = "0.1.0"
description = "Python bindings to the dfg_da Rust wrappers (C++ single-cluster LBP)"
requires-python = ">=3.8"

[tool.maturin]
# Crate lives in a workspace; point maturin at this crate's manifest.
manifest-path = "Cargo.toml"
module-name = "dfg_da_py"
# Enable the extension-module feature only for the wheel/develop build so the
# cdylib does not link libpython. The `stub_gen` binary is built separately
# without this feature. Regenerate stubs after building: `cargo run --bin stub_gen`.
features = ["extension-module"]
